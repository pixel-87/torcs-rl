name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    
    - uses: DeterminateSystems/nix-installer-action@v31
    
    - uses: DeterminateSystems/magic-nix-cache-action@v13

    - name: Run Smoke Test
      run: |
        nix develop --command bash -c "uv sync && uv run scripts/smoke_test.py"
